<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="50%" stop-color="#060811" />
      <stop offset="100%" stop-color="#110c24" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="neonPink" x1="56" y1="8" x2="8" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5E7E" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded Cosmic Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#neonCyan)" stroke-width="2" />

  <!-- Subtle 3x3 Vedic Grid Reference -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="22" y1="10" x2="22" y2="54" />
    <line x1="42" y1="10" x2="42" y2="54" />
    <line x1="10" y1="22" x2="54" y2="22" />
    <line x1="10" y1="42" x2="54" y2="42" />
  </g>

  <!-- Outer Sacred Compass Ring -->
  <circle cx="32" cy="32" r="23" stroke="url(#neonCyan)" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="3 2" />

  <!-- Vedic Star Geometry: Square 1 (Axis Aligned) -->
  <polygon
    points="32,9 55,32 32,55 9,32"
    stroke="url(#neonCyan)"
    stroke-width="2.2"
    stroke-linejoin="round"
    fill="#00D9F5"
    fill-opacity="0.07"
    filter="url(#glow)"
  />

  <!-- Vedic Star Geometry: Square 2 (Rotated 45 deg Octagram) -->
  <polygon
    points="16,16 48,16 48,48 16,48"
    stroke="url(#neonPink)"
    stroke-width="2.2"
    stroke-linejoin="round"
    fill="#EC4899"
    fill-opacity="0.07"
    filter="url(#glow)"
  />

  <!-- Inner Harmonic Hexagon / Star Chords -->
  <line x1="16" y1="16" x2="48" y2="48" stroke="url(#neonCyan)" stroke-width="1.4" stroke-opacity="0.65" />
  <line x1="48" y1="16" x2="16" y2="48" stroke="url(#neonPink)" stroke-width="1.4" stroke-opacity="0.65" />

  <!-- Glowing Active Corner Nodes -->
  <circle cx="32" cy="9" r="2.6" fill="#00F5A0" />
  <circle cx="55" cy="32" r="2.6" fill="#00D9F5" />
  <circle cx="32" cy="55" r="2.6" fill="#A855F7" />
  <circle cx="9" cy="32" r="2.6" fill="#00D9F5" />

  <circle cx="16" cy="16" r="2.3" fill="#FF5E7E" />
  <circle cx="48" cy="16" r="2.3" fill="#F59E0B" />
  <circle cx="48" cy="48" r="2.3" fill="#EC4899" />
  <circle cx="16" cy="48" r="2.3" fill="#F59E0B" />

  <!-- Central Sacred Octahedron Core -->
  <polygon
    points="32,23 41,32 32,41 23,32"
    fill="url(#neonCyan)"
    stroke="#ffffff"
    stroke-width="1.5"
  />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
</svg>
